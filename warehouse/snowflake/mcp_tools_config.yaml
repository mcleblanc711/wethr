# Service config for the local Snowflake-Labs MCP server (uvx snowflake-labs-mcp),
# used from Claude Code. Read-only twice over: the connection logs in as a
# user holding only WETHR_READER, and this allowlist rejects non-read statements
# before they are sent.
other_services:
  object_manager: False
  query_manager: True
  semantic_manager: False
sql_statement_permissions:
  - Select: True
  - Describe: True
  - Use: True
  - Command: True      # SHOW ... statements
  - Alter: False
  - Comment: False
  - Commit: False
  - Copy: False
  - Create: False
  - Delete: False
  - Drop: False
  - Insert: False
  - Merge: False
  - Rollback: False
  - Transaction: False
  - TruncateTable: False
  - Unknown: False
  - Update: False
