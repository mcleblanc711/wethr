[project]
name = "wethr-collector"
version = "0.1.0"
description = "Weather prediction market collector and calibration tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "py-clob-client>=0.15.0",
    "pyarrow>=16.0.0",
    "scipy>=1.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-socket>=0.7.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false
required-version = "==0.11.32"
